name: Release

on:
  push:
    tags: ["v*"]
  # Manual re-run for cases like "a package was missed by the publish
  # script and needs to catch up to a version already tagged/released" —
  # publish-workspace.mjs already skips anything whose package.json
  # version matches the registry, so a manual run is safe to fire even
  # when most packages have nothing new to publish.
  workflow_dispatch: {}

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing exchanges the workflow's OIDC token for a short-lived
      # registry credential; npm gained that exchange in 11.5, and the runner's
      # bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: |
          npm i -g npm@12.0.1
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same pre-publish gate as CI (.github/workflows/ci.yml) — a release
      # must never ship a build that CI itself would have failed.
      - name: Build packages
        run: pnpm run build:packages

      - name: Core tests
        run: pnpm run test:core

      - name: Adapter tests
        run: pnpm run test:adapters

      - name: Widget tests
        run: pnpm run test:widgets

      - name: Build Angular library
        run: pnpm run build:angular

      - name: Angular tests
        run: pnpm run test:angular

      # Tree-shaking only; the size assertion was removed for the same reason.
      - name: Tree-shaking check
        run: pnpm run test:bundle

      # Reports the figures behind docs/guides/comparison-form-libraries.md. It used to gate on a
      # 16 KB budget and the entry measures 17.0 KB, so it was failing releases for changes that were
      # correct — a budget raised every time a feature crosses it is a record, not a limit.
      - name: Core bundle sizes (reported)
        run: pnpm run test:core-bundle

      - name: Theme class parity
        run: pnpm run test:themes

      - name: Production dependency audit
        run: pnpm audit --prod

      # Org policy currently blocks GitHub Actions from creating PRs with
      # GITHUB_TOKEN. Versioning remains changesets-driven, but the version
      # bump PR is created/merged by maintainers.
      #
      # This is the only path that publishes. The registry credential is minted
      # from the job's OIDC token against the trusted publisher each package
      # declares on npm, so no token lives in repository secrets; `release:stage`
      # is a local rehearsal (`npm publish --dry-run`) and never reaches npm.
      - name: Publish from committed versions
        run: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: true
