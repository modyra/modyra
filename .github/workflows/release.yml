name: Release

on:
  # Deliberately dispatch-only. A tag is created by accident — a mistyped `git tag`, a rebase that
  # replays one, a script — and a tag that reaches the registry path turns a slip into a release.
  # A dispatch cannot be fired by anything but somebody choosing to fire it, and the confirmation
  # below has no default, so the choice has to be typed out.
  #
  # The version is not asked for and could not be answered: this release is twenty-five package
  # versions on six lines, computed by `changeset version` from the committed changesets. A number
  # typed here would either be ignored or override what was computed, and in the second case four
  # packages ship under a number that is not theirs. What the run prints in its summary is the plan.
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "stage the release" to proceed'
        required: true
        default: ""

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Ninety, and deliberately not read off this job's own history. Past runs took four minutes,
    # but they predate the gates above: this job now runs the node battles, installs Chromium and
    # runs the browser battles, so its cost is the sum of its steps rather than what it used to be.
    # A limit calibrated on the past would kill every release from here on.
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    steps:
      # Before anything is built, so a mistyped dispatch costs seconds rather than a full build.
      - name: The confirmation was typed
        run: |
          if [ "${{ inputs.confirm }}" != "stage the release" ]; then
            echo "::error::The release was dispatched without its confirmation phrase."
            echo "Type: stage the release"
            exit 1
          fi

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # **What is staged must be what a tag names.** The checkout takes the branch this dispatch was
      # fired from, not the tag: `release:integrate` writes the versions and the tag together, and
      # anything landing on the branch afterwards is built, packed and staged under a number that
      # names a different commit. The changelogs would describe one tree and the tarballs carry
      # another, and every gate below would pass — measuring the tree it was handed rather than the
      # one the label promises.
      #
      # Read from the repository rather than asked as an input: a tag typed into a dispatch is one
      # more thing to get right, and the question here is not which tag but whether this commit is
      # one. Tags are fetched explicitly so this does not rest on what the checkout action brings.
      - name: This commit is the one a tag names
        run: |
          git fetch --tags --force --quiet
          TAGS=$(git tag --points-at HEAD)
          if [ -z "$TAGS" ]; then
            echo "::error::HEAD ($(git rev-parse --short HEAD)) carries no tag, so there is nothing this release is named after."
            echo "The versions and their tag are written together by \`release:integrate\`. Dispatch from the tagged commit." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "staging $(git rev-parse --short HEAD), named by: $TAGS" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing exchanges the workflow's OIDC token for a short-lived
      # registry credential; npm gained that exchange in 11.5, and the runner's
      # bundled npm is older.
      - name: Upgrade npm for trusted publishing
        run: |
          npm i -g npm@12.0.1
          npm --version

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same pre-publish gate as CI (.github/workflows/ci.yml) — a release
      # must never ship a build that CI itself would have failed.
      - name: Build packages
        run: pnpm run build:packages

      - name: Core tests
        run: pnpm run test:core

      - name: Adapter tests
        run: pnpm run test:adapters

      - name: Widget tests
        run: pnpm run test:widgets

      - name: Build Angular library
        run: pnpm run build:angular

      - name: Angular tests
        run: pnpm run test:angular

      # Tree-shaking only; the size assertion was removed for the same reason.
      - name: Tree-shaking check
        run: pnpm run test:bundle

      # The board, which the gate above does not include. The file's own promise — a release must
      # never ship a build CI itself would have failed — was true of the unit suites and not of the
      # ratchets: `battle:ci` and `battle:browser:ci` fail on a red that is not in their baseline,
      # which is the only check that has ever caught a renderer disagreeing with the contract.
      - name: Node battles
        run: pnpm run battle:ci

      - name: Install Chromium for the browser battles
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser battles
        run: pnpm run battle:browser:ci

      # Every architectural decision has its record, and every record is listed. A release is the
      # moment a decision reaches somebody who cannot ask why.
      - name: Decision records
        run: pnpm run test:docs

      # What the workspace resolves through source beside a manifest, a consumer resolves through a
      # tarball or not at all. This packs every publishable package — including packages/angular/dist,
      # whose root manifest is private and which every sweep over `packages/*` therefore misses —
      # installs them together, and asks for every subpath each one declares.
      - name: Every declared subpath resolves from its tarball
        run: node scripts/verify-tarballs.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # Printed rather than gated. There is no budget here on purpose: a budget raised whenever a
      # feature crosses it is a record, not a limit, and this file already carries that lesson above.
      # What a number in the summary buys is that the first person to look after a release has one.
      - name: The contract, against the last release
        run: |
          PREVIOUS=$(git tag --list 'v*' --sort=-v:refname | head -1)
          echo "### Contract against $PREVIOUS" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          node scripts/contract-diff.mjs --since "$PREVIOUS" | tail -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      # Reports the figures behind docs/guides/comparison-form-libraries.md. It used to gate on a
      # 16 KB budget and the entry measures 17.0 KB, so it was failing releases for changes that were
      # correct — a budget raised every time a feature crosses it is a record, not a limit.
      - name: Core bundle sizes (reported)
        run: pnpm run test:core-bundle

      - name: Theme class parity
        run: pnpm run test:themes

      - name: Production dependency audit
        run: node scripts/audit-production-dependencies.mjs --required

      # Org policy currently blocks GitHub Actions from creating PRs with
      # GITHUB_TOKEN. Versioning remains changesets-driven, but the version
      # bump PR is created/merged by maintainers.
      #
      # This is the only path that reaches the registry. The credential is minted
      # from the job's OIDC token against the trusted publisher each package
      # declares on npm, which permits `npm stage publish`: the tarball and its
      # provenance are uploaded here, and a maintainer makes them public with
      # proof of presence. `release:rehearse` is the local dry run.
      # **Staging reads the versions in the manifests, and nothing here writes them.** `changeset
      # version` consumes the changesets, bumps every manifest and writes the changelogs, and it is
      # run before the dispatch — so a dispatch with changesets still pending stages the *previous*
      # numbers carrying this content. It is the same shape as a built artefact inheriting a stale
      # version: what ships is the state of the tree at a moment nobody checked.
      #
      # Read from the tree rather than from a file of intent, so there is nothing extra to remember:
      # a consumed changeset is a deleted file, so their presence is the question.
      - name: The versions have been applied
        run: |
          PENDING=$(ls .changeset/*.md 2>/dev/null | grep -viE '/README\.md$' | wc -l | tr -d ' ')
          if [ "$PENDING" != "0" ]; then
            echo "::error::$PENDING changeset(s) are still pending, so the manifests carry the previous versions."
            echo "Run \`pnpm run release:integrate\` and commit the bump before dispatching." >> "$GITHUB_STEP_SUMMARY"
            pnpm changeset status >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            exit 1
          fi

      - name: Stage the release from committed versions
        run: pnpm run release
        env:
          NPM_CONFIG_PROVENANCE: true
