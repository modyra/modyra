name: CI

on:
  push:
    branches: [main]
  pull_request:

# A push supersedes the run of the commit it replaced; finishing the old one buys nothing and
# delays the verdict on the code that actually exists. Runs on main are never cancelled — every
# main commit keeps its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # A job that hangs on `main` does not fail: it holds its concurrency group until the platform
    # default of six hours expires, and every push behind it queues rather than running. That is an
    # outage of verification, and it is silent — the queued runs report `pending`, not `blocked`.
    # The limit is roughly twice the longest green run, so a slow runner still finishes and a hung
    # one is released in minutes.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Core tests
        run: pnpm run test:core

      - name: Adapter tests
        run: pnpm run test:adapters

      - name: Widget tests
        run: pnpm run test:widgets

      # **Before the contract gates, and that ordering is load-bearing.** `test:conformance-angular`
      # drives the built library through `packages/angular/conformance.config.mjs`, which imports
      # `dist/fesm2022/modyra-angular.mjs`. Run after the gates it fails to load the config at all,
      # and the run says the config is broken rather than that nothing had built it yet.
      - name: Build Angular library
        run: pnpm run build:angular

      # One gate for the UI contract: the golden Angular surface, the completeness evidence,
      # the widgets suite, the framework-free renderer's catalog and DOM conformance, and the
      # per-renderer readiness audit.
      - name: UI contract gates
        run: pnpm run test:contracts

      # The corpus is read by four runtimes and only three of them are JavaScript. The gate above
      # asserts that every fixture is *named* by the readers outside this language; this asserts that
      # what they do with it agrees. Neither replaces the other: a reader can be shown a document and
      # disagree about it, and it can agree about every document it was shown while never being shown
      # the newest one.
      #
      # No toolchain step and no cache: cargo ships with the runner image — Rust 1.98 on both the
      # current label and the one after it, read from the published manifest rather than assumed —
      # and the whole thing builds from an empty CARGO_HOME in 14 seconds, two dependencies deep.
      # Caching a fourteen-second build costs more attention than it returns.
      - name: The Rust reader agrees with the corpus
        run: cargo test --manifest-path sdk/rust/modyra-contract/Cargo.toml

      - name: Studio and framework-free renderer tests
        run: pnpm run test:studio

      # The editor extension's bundle is checked here rather than only built: it is CommonJS around
      # ES-module dependencies, and a dependency shipping a UMD build leaves a `require` that fails
      # on the first document opened rather than at load.
      - name: Editor extension tests
        run: pnpm run test:vscode

      # The libraries are compiled by TypeScript 7 and the Angular toolchain is not: what ships is
      # only safe while the two compilers emit the same artifacts, so that is checked every push.
      #
      # **After Studio, and that ordering is load-bearing.** The comparison compiles all twenty-one
      # projects, and the studio packages import each other by package name — so they need each
      # other's `dist`, which only `build:studio` produces. Run earlier it fails on nine projects
      # with `TS2307: Cannot find module '@modyra/studio-model'`, which says nothing about either
      # compiler.
      - name: TypeScript 7 emit matches the primary compiler
        run: pnpm run test:typescript7

      - name: Angular tests
        run: pnpm run test:angular

      # Tree-shaking only. The size budgets that used to gate here were removed: every legitimate
      # feature moved the number and the budget was raised to match, which makes it a record of past
      # sizes rather than a limit — and it broke builds for changes that were correct.
      #
      # What survives is the property a feature does not change: renderers, devtools, the wizard and
      # dynamic forms must stay out of a core-only bundle. `npm run test:core-bundle` still exists
      # and still prints its numbers for anyone watching drift on purpose.
      - name: Tree-shaking check
        run: pnpm run test:bundle

      # Known Lit parity gaps are allowlisted in
      # scripts/theme-parity-allowlist.json; new regressions fail the check.
      - name: Theme class parity
        run: pnpm run test:themes

      # Blocking. It was advisory "while it stabilizes", and the two things keeping it unstable were
      # both defects rather than noise: a test asserting the opposite of the contract, which passed
      # whenever its focus precondition silently failed, and three theme swaps waiting a fixed 450ms
      # instead of the stylesheet's load event — fine alone, not under nine parallel projects.
      #
      # What cannot run is quarantined by name in the specs themselves. A permissive suite hides the
      # difference between a known gap and an unknown one.
      # A pull request answers with one engine; main answers with three. The full matrix is where
      # both documented load-sensitive families live and where two thirds of the pipeline's wall
      # time went, and an engine-specific regression is rare enough that finding it at merge — with
      # the release still guarded by the full run — costs less than paying the matrix on every push.
      - name: Browser smoke test (chromium, pull requests)
        if: github.event_name == 'pull_request'
        run: |
          npx playwright install --with-deps chromium
          node scripts/audit-baseline-parity.mjs
          pnpm run build:demo
          pnpm run build:examples
          npx playwright test --project=angular --project=plain --project=lit

      - name: Browser smoke test (full matrix, main)
        if: github.event_name != 'pull_request'
        run: |
          npx playwright install --with-deps chromium firefox webkit
          pnpm run test:e2e

      # A failed visual comparison is only actionable if the actual and diff images can be read.
      # Without this, diagnosing a baseline mismatch means re-recording on a runner — a full
      # workflow round-trip to see what one image already showed.
      - name: Publish browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # What a consumer actually receives: the tarballs, installed into a project that has never seen
      # this repository, with every declared entry point imported and type-checked. Blocking from the
      # day it lands — it is green, and a packaging break is invisible everywhere else.
      - name: Published tarballs
        run: pnpm run test:tarballs

      # DOM weight per field and post-unmount leaks for forms of 100/500/1000 fields. Budgets and
      # their reasoning live in packages/plain/metrics/form-scale-budget.json; only exact figures
      # are gated, never the jsdom timings the run also prints.
      #
      # **Still advisory, and now with a reason rather than a date.** The figures it gates are counts
      # rather than timings, so hardware is not the variable — what has not been established is
      # whether they hold on a runner at all, and nothing here has ever observed one. Flipping it
      # blind would gate merges on a number this repository has never seen produced.
      - name: Form scale budgets
        run: pnpm run test:form-scale
        continue-on-error: true

      - name: Production dependency audit
        run: pnpm audit --prod
