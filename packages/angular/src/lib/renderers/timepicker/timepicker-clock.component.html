<div class="mdy-timepicker-container" [class.mdy-timepicker--dial]="viewMode() === 'dial'"
     (keydown)="onClockKeydown($event)">
  <div class="mdy-timepicker-content">
    
    <!-- Unified M3 Header (Used by both Input and Dial variants) -->
    <mdy-timepicker-header
      [hour]="hourDisplay()"
      [minute]="minuteDisplay()"
      [period]="periodDisplay()"
      [format]="format()"
      [steps]="steps()"
      [focusedField]="focusedField()"
      [viewMode]="viewMode()"
      [disabled]="disabled()"
      (hourInput)="onHourInput($event)"
      (hourStep)="onHourStep($event)"
      (minuteInput)="onMinuteInput($event)"
      (minuteStep)="onMinuteStep($event)"
      (fieldFocus)="focusedField.set($event)"
      (fieldClick)="focusedField.set($event)"
      (periodChange)="togglePeriod($event)"
    />

    @if (viewMode() === 'dial') {
      <!-- M3 Dial Variant (Only shows the clock below the header) -->
      <div class="mdy-timepicker-dial-variant">
        <div class="mdy-timepicker-dial">
          <!-- A dial is a slider around a circle. It had no role, no value and no keyboard: every
               number on it was reachable only by dragging, which is the one gesture a keyboard
               cannot make and a screen reader cannot describe. -->
          <div
            #dialFace
            class="mdy-timepicker-dial__face"
            tabindex="0"
            [attr.role]="dialAria().role"
            [attr.aria-valuemin]="dialAria().valueMin"
            [attr.aria-valuemax]="dialAria().valueMax"
            [attr.aria-valuenow]="dialAria().valueNow"
            [attr.aria-valuetext]="dialAria().valueText"
            [attr.aria-label]="focusedField() === 'hour' ? i18n.timepickerHourLabel : i18n.timepickerMinuteLabel"
            [attr.aria-disabled]="disabled() ? 'true' : null"
            (mousedown)="onDragStart($event)"
            (touchstart)="onDragStart($event)"
          >
            <!-- The hand reaches only as far as the ring it points into: a 24-hour face puts two
                 hours at one direction, so one length leaves the two selections identical. -->
            <div
              class="mdy-timepicker-dial__hand"
              [class.mdy-timepicker-dial__hand--inner]="handRing() === 'inner'"
              [style.transform]="'rotate(' + handRotation() + 'deg)'"
            ></div>
            @for (number of dialNumbers(); track number.value) {
              <div class="mdy-timepicker-dial__number"
                   [class.mdy-timepicker-dial__number--selected]="number.value === faceValue()"
                   [class.mdy-timepicker-dial__number--inner]="number.ring === 'inner'"
                   [style.--index]="number.index">
                {{ number.label }}
              </div>
            }
          </div>
        </div>
      </div>
    }
  </div>

  <div class="mdy-timepicker-actions">
    <button
      type="button"
      class="mdy-timepicker-mode-toggle"
      [attr.aria-label]="viewMode() === 'input' ? i18n.timepickerSwitchToDial : i18n.timepickerSwitchToInput"
      (click)="setViewMode(viewMode() === 'input' ? 'dial' : 'input')">
      @if (viewMode() === 'input') {
        <!-- Switch to dial icon (clock) -->
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm0 18c-4.4 0-8-3.6-8-8s3.6-8 8-8 8 3.6 8 8-3.6 8-8 8zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z" fill="currentColor"/></svg>
      } @else {
        <!-- Switch to keyboard icon -->
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 5H4c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zm-1 5H5v-2h2v2zm10 0H7v-2h10v2zm0-3h-2v-2h2v2zm0-3h-2V8h2v2zm3 6h-2v-2h2v2z" fill="currentColor"/></svg>
      }
    </button>

    <div class="mdy-timepicker-spacer"></div>

    <button type="button" class="mdy-timepicker-action-btn" (click)="cancelClicked.emit()">{{ i18n.timepickerCancel }}</button>
    <button type="button" class="mdy-timepicker-action-btn mdy-timepicker-action-btn--confirm" (click)="confirmClicked.emit()">{{ i18n.timepickerConfirm }}</button>
  </div>
</div>
