allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true
packages:
  - "packages/*"
  - "apps/*"
linkWorkspacePackages: true
overrides:
  esbuild: "^0.28.1"
  "uuid@<11.1.1": ">=11.1.1"
  # GHSA-rgw5-rvv9-x895 and GHSA-… : reachable only through eslint's minimatch, which pins a
  # major this project never asks for directly.
  "brace-expansion@<5.0.9": ">=5.0.9"
  # Eight packages, dev-time only: none reaches a consumer of a published package. Each is pinned inside
  # the major that is installed, because the majors above have all moved on and a jump would be a
  # dependency change rather than a patch.
  "fast-uri@<3.1.5": ">=3.1.5 <4"
  "ip-address@<10.3.1": ">=10.3.1 <11"
  "js-yaml@>=3 <3.15.1": ">=3.15.1 <4"
  "js-yaml@>=4 <4.3.1": ">=4.3.1 <5"
  "postcss@<8.5.23": ">=8.5.23 <9"
  "undici@>=6 <6.28.0": ">=6.28.0 <7"
  "undici@>=7 <7.29.0": ">=7.29.0 <8"
  "hono@<4.12.34": ">=4.12.34 <5"
  "@hono/node-server@<1.19.15": ">=1.19.15 <2"
  "webpack-dev-server@<5.2.6": ">=5.2.6 <6"
