<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <link id="theme" rel="stylesheet" href="./themes/modyra-modern.css" />
    <title>Modyra × lit — enterprise</title>
    <style>
      body { margin: 2rem auto; max-width: 60rem; font-family: system-ui, sans-serif; }
      .order-box { border: 1px solid var(--mdy-outline-variant); border-radius: 10px; padding: 0.75rem 1rem; margin: 0.75rem 0; background: var(--mdy-surface); }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.5rem; }
      .demo-state { font-size: 0.8125rem; border-left: 3px solid var(--mdy-primary); padding: 0.6rem 0.85rem; background: var(--mdy-surface-container-low); overflow-x: auto; }
      .bar { display: flex; gap: 0.5rem; flex-wrap: wrap; margin: 1rem 0; }
      .demo-scenario { max-width: 60ch; opacity: 0.9; margin: 0 0 1rem; }
      .demo-level { border-left: 3px solid color-mix(in srgb, var(--mdy-primary) 60%, transparent); padding-left: 0.85rem; margin: 0.6rem 0; }
      .demo-level .demo-level { border-left-color: color-mix(in srgb, var(--mdy-primary) 35%, transparent); }
      .demo-level .demo-level .demo-level { border-left-color: color-mix(in srgb, var(--mdy-primary) 18%, transparent); }
      .demo-level-caption { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--mdy-on-surface-variant); }
      .demo-badge { display: inline-block; padding: 0.05rem 0.5rem; border-radius: 999px; font-size: 0.72rem; background: color-mix(in srgb, var(--mdy-primary) 14%, transparent); }
      .demo-hidden-note { font-size: 0.8rem; font-style: italic; opacity: 0.75; }
      .demo-action { display: grid; gap: 0.05rem; text-align: left; }
      .demo-action small { font-size: 0.7rem; opacity: 0.75; font-weight: normal; }
      .demo-verdict { font-size: 0.9rem; }
      .demo-verdict li { margin: 0.15rem 0; list-style: none; }
      .demo-verdict .ok::before { content: "\2713  "; color: var(--mdy-primary); }
      .demo-verdict .ko::before { content: "\2717  "; }
      .demo-verdict + details { margin-top: 0.5rem; }
      .demo-verdict + details summary { cursor: pointer; font-size: 0.78rem; opacity: 0.8; }
    </style>
  </head>
  <body>
    <nested-orders></nested-orders>
    <nested-invoices></nested-invoices>
    <script type="module" src="./enterprise.js"></script>
  </body>
</html>
