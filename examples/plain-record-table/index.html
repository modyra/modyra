<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="./themes/modyra-base.css" />
    <link rel="stylesheet" href="./themes/modyra-modern.css" />
    <title>Modyra × a table keyed by data</title>
    <style>
      body {
        margin: 0;
        padding: 2rem;
        font-family: system-ui, sans-serif;
        background: var(--mdy-surface);
        color: var(--mdy-on-surface);
      }
      main { max-width: 60rem; margin: 0 auto; }
      p.lead { color: var(--mdy-on-surface-variant); max-width: 46rem; }
      table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
      th {
        text-align: left;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--mdy-on-surface-variant);
        padding: 0 0.75rem 0.5rem;
      }
      td { padding: 0.25rem 0.75rem; vertical-align: top; border-top: 1px solid var(--mdy-outline-variant); }
      td.read { padding-top: 0.9rem; }
      tr.editing { background: var(--mdy-surface-container-low); }
      .row-actions { display: flex; gap: 0.5rem; }
      button {
        font: inherit;
        padding: 0.35rem 0.75rem;
        border-radius: 0.5rem;
        border: 1px solid var(--mdy-outline-variant);
        background: var(--mdy-surface-container);
        color: var(--mdy-on-surface);
        cursor: pointer;
      }
      button.primary { background: var(--mdy-primary); color: var(--mdy-on-primary); border-color: transparent; }
      .verdict { margin-top: 1.5rem; font-family: ui-monospace, monospace; font-size: 0.8125rem; white-space: pre; }
    </style>
  </head>
  <body>
    <main>
      <h1>A table keyed by data</h1>
      <p class="lead">
        Every cell is mounted by its own column, one row at a time, and rows enter and leave edit mode
        while the table is sorted. None of that touches the values or the validity: a row exists
        because it was declared, not because something is rendering it.
      </p>
      <div id="table"></div>
      <div class="verdict" id="verdict"></div>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
